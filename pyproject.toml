[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "kvserve_v1"
version = "0.2.0"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "msgpack",
    "pyzmq",
]

[project.optional-dependencies]
runtime = ["torch>=2.6", "numpy"]
runtime-cu12 = ["nvidia-nvcomp-cu12==5.3.0.16"]
runtime-cu13 = ["nvidia-nvcomp-cu13==5.3.0.16"]
fused = ["tilelang==0.1.9", "scipy>=1.10"]
bitpack = ["torch>=2.6", "triton>=3.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kvserve_v1*"]

[tool.setuptools.package-data]
"kvserve_v1.compression.config.duo_config" = ["*.csv"]

"kvserve_v1.compression.runtime" = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.h"]
